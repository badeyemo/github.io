<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Display</title>
    <style>
        div {
            height: 200px;
            width: 200px;
            margin: 5px;
            background: green;
            }

#three, #four {
            display: inline;

            }
        
    </style>
</head>
<body>
    <div id="one">I AM A BOX</div>
    <div id="Two">I AM A BOX</div>
    <div id="three">I AM A BOX</div>
    <div id="four">I AM A BOX</div>
</body>
</html>
